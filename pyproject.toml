[project]
name = "lpdl"
version = "2.0.0a1"
description = "LPDL v2 — Limbus Company 인격 메커니즘 기술 언어 (파서 + 검증기)"
requires-python = ">=3.12"
dependencies = ["lark>=1.2", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lpdl = "lpdl.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lpdl"]

[tool.setuptools.package-data]
lpdl = ["grammar.lark", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
